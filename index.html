<html>
<head>
  <meta charset="UTF-8">
  <title>Import Management SIG</title>
  <link rel="preload" href="assets/images/home-page.avif" as="image">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="home-page">
  <div class="page-container">
    <h1 style="font-size: 60px;">Import Management SIG ▾</h1>
    <div id="current-po-banner" class="po-banner"></div>
    <a href="dashboard.html" class="featured-card-link">
      <button class="featured-card">
        <span>Data Dashboard & Analytics</span>
        <span style="color: var(--text-muted);">Lihat →</span>
      </button>
    </a>
    <div id="module-grid" class="module-grid"></div>
    <div class="app-watermark">v1.0 | Athaya Shata</div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    const modules = [
      { name: "Master PO", file: "pages/master-po.html", alwaysActive: true },
      { name: "Pre-Import", file: "pages/preimport.html" },
      { name: "Input PO", file: "pages/inputpo.html" },
      { name: "Proses L/C", file: "pages/lc.html" },
      { name: "Shipping Document", file: "pages/shipping.html" },
      { name: "Proses PIB", file: "pages/pib.html" },
      { name: "Proses Jaspel", file: "pages/jaspel.html" },
      { name: "PP Barang", file: "pages/pp-barang.html" },
      { name: "Proses LS", file: "pages/ls.html" },
      { name: "BAST", file: "pages/bast.html" },
      { name: "Pengeluaran Barang", file: "pages/pengeluaran.html" }
    ];

    function getSelectedPO() {
      const raw = sessionStorage.getItem("selectedPO");
      return raw ? JSON.parse(raw) : null;
    }

    function render() {
      const selected = getSelectedPO();
      const banner = document.getElementById("current-po-banner");

      if (selected) {
        banner.className = "po-banner";
        banner.innerHTML = `
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="color: var(--text-secondary);">PO Aktif:</span>
            <strong>${selected.nomor_po} </strong> 
            <span style="color: var(--text-muted);"> | Shipment:</span>
            <strong> ${selected.shipment}</strong>
          </div>
          <button onclick="clearPO()">Ganti PO</button>`;
      } else {
        banner.className = "po-banner empty";
        banner.innerHTML = `<em style="color: var(--text-muted);">Belum ada PO dipilih. Silakan pilih atau tambah PO melalui Master PO.</em>`;
      }

      const qs = selected ? `?po=${encodeURIComponent(selected.nomor_po)}&shipment=${selected.shipment}` : "";

      document.getElementById("module-grid").innerHTML = modules.map(m => {
        const active = m.alwaysActive || selected;
        if (active) {
          return `<a href="${m.file}${qs}"><button>${m.name}</button></a>`;
        } else {
          return `<button disabled title="Pilih PO terlebih dahulu">${m.name}</button>`;
        }
      }).join("");
    }

    function clearPO() {
      sessionStorage.removeItem("selectedPO");
      render();
    }

    render();
  </script>
</body>
</html>
