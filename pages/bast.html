<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAST - Import Management SIG</title>
  <link rel="preload" href="../assets/images/app-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="app-page">
  <div class="page-container">
    <nav class="page-nav">
      <a href="../index.html">← Kembali ke Home</a>
    </nav>
    <h1>BAST</h1>
    <div id="po-context" class="po-banner"></div>

    <form id="bast-form" class="grid-form">
      <label>
        Tanggal Monitoring BAST Release
        <input type="date" id="monitoring_bast_release">
      </label>

      <label>
        Hasil Monitoring BAST Release
        <select id="hasil_monitoring_bast_release">
          <option value="">-- Pilih --</option>
          <option value="RELEASED">RELEASED</option>
          <option value="BELUM RELEASED">BELUM RELEASED</option>
        </select>
      </label>

      <label>
        Tanggal BAST Release dari Inventory
        <input type="date" id="bast_release_dari_inventory">
      </label>

      <label>
        Tanggal Kirim BAST ke Vendor
        <input type="date" id="kirim_bast_ke_vendor">
      </label>

      <label>
        Tanggal BAST All Signed
        <input type="date" id="bast_all_signed">
      </label>

      <label>
        BAST No
        <input type="text" id="bast_no">
      </label>

      <label>
        Deskripsi Barang
        <input type="text" id="deskripsi_barang">
      </label>

      <label>
        Nilai Barang
        <input type="number" step="0.01" min="0" id="nilai_barang">
      </label>

      <label>
        Currency
        <input type="text" id="curr" placeholder="mis. EUR, USD">
      </label>

      <label>
        Keterangan BAST Tambahan
        <textarea id="ket_bast_tambahan" rows="1"></textarea>
      </label>

      
      <label class="grid-span-full">
        Lampiran Dokumen
        <div style="display:flex; gap: 8px; align-items: center;">
          <input type="file" id="lampiran_file" style="flex: 1;">
          <div id="lampiran_link"></div>
        </div>
      </label>
      <button type="submit" class="grid-span-full btn-primary">Simpan BAST</button>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/page-utils.js"></script>
  <script>
    let recordId = null;
    const fields = [
      "monitoring_bast_release", "hasil_monitoring_bast_release",
      "bast_release_dari_inventory", "kirim_bast_ke_vendor", "bast_all_signed",
      "bast_no", "deskripsi_barang", "nilai_barang", "curr", "ket_bast_tambahan"
    ];

    async function loadBast() {
      try {
        const data = await sbGet("proses_bast", `?${poFilter()}&select=*&limit=1`);
        if (data.length > 0) {
          recordId = data[0].id;
          const p = data[0];
          fields.forEach(f => {
            if(document.getElementById(f)) document.getElementById(f).value = p[f] ?? "";
          });
          if (p.lampiran_url) {
            document.getElementById("lampiran_link").innerHTML = `<a href="${escapeHtml(p.lampiran_url)}" target="_blank" style="color:var(--success); font-weight:500;">Lihat ${escapeHtml(p.nama_lampiran || 'Lampiran')}</a>`;
          }
        }
      } catch (err) {
        showToast("Gagal memuat BAST: " + err.message, "error");
      }
    }

    document.getElementById("bast-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      setSubmitting(e.target, true);
      const data = {
        master_id: masterId ? parseInt(masterId) : null,
        nomor_po: nomorPO,
        shipment: parseInt(shipment)
      };
      fields.forEach(f => {
        data[f] = document.getElementById(f).value || null;
      });
      
      const fileInput = document.getElementById("lampiran_file");
      if (fileInput && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const ext = file.name.split('.').pop();
        const uniqueName = `${Date.now()}-${Math.random().toString(36).substring(2, 8)}.${ext}`;
        const filePath = `${masterId || nomorPO + '-' + shipment}/${uniqueName}`;
        try {
          await sbUploadFile("attachments", filePath, file);
          data.lampiran_url = sbGetPublicUrl("attachments", filePath);
          data.nama_lampiran = file.name;
        } catch(err) {
          showToast("Gagal upload lampiran: " + err.message, "error");
          return;
        }
      }

      try {
        if (recordId) {
          await sbUpdate("proses_bast", data, `id=eq.${recordId}`);
        } else {
          const inserted = await sbInsert("proses_bast", data);
          if (inserted && inserted.length > 0) {
            recordId = inserted[0].id;
          }
        }
        showToast("BAST berhasil disimpan", "success");
      } catch (err) {
        showToast(getSupabaseErrorMessage(err, "Gagal menyimpan: " + err.message), "error");
      } finally {
        setSubmitting(e.target, false);
      }
    });

    loadContext();
    loadBast();
  </script>
</body>

</html>
