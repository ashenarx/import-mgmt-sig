<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Import Management SIG</title>
  <link rel="preload" href="../assets/images/home-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="home-page">

  <div class="page-container" style="max-width: 400px; margin: 10vh auto; text-align: center;">

    <h1 id="form-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Login</h1>
    <p id="form-subtitle" style="color: var(--text-secondary); margin-bottom: 2rem;">Masuk untuk mengelola data Import
    </p>

    <!-- Login Form -->
    <form id="login-form" style="text-align: left;">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="login-email" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Email</label>
        <input type="email" id="login-email" required placeholder="admin@semengresik.com"
          style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="login-password" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password</label>
        <input type="password" id="login-password" required style="width: 100%; box-sizing: border-box;">
      </div>

      <button type="submit" id="btn-login" style="width: 100%; margin-bottom: 1rem;">Masuk</button>

      <div style="text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        Belum punya akun? <a href="#" id="show-register" style="color: var(--primary); text-decoration: none;">Daftar
          sekarang</a>
      </div>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="text-align: left; display: none;">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="reg-email" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Email</label>
        <input type="email" id="reg-email" required placeholder="admin@semengresik.com"
          style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="reg-password" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password</label>
        <input type="password" id="reg-password" required minlength="6" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="reg-key" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Registration Key</label>
        <input type="text" id="reg-key" required placeholder="Masukkan Auth Key"
          style="width: 100%; box-sizing: border-box;">
      </div>

      <button type="submit" id="btn-register" style="width: 100%; margin-bottom: 1rem;">Daftar</button>

      <div style="text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        Sudah punya akun? <a href="#" id="show-login" style="color: var(--primary); text-decoration: none;">Masuk di
          sini</a>
      </div>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    // Redirect if already logged in
    if (sbGetSession()) {
      window.location.href = "../index.html";
    }

    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const formTitle = document.getElementById("form-title");
    const formSubtitle = document.getElementById("form-subtitle");

    // Toggles
    document.getElementById("show-register").addEventListener("click", (e) => {
      e.preventDefault();
      loginForm.style.display = "none";
      registerForm.style.display = "block";
      formTitle.textContent = "Daftar Akun";
      formSubtitle.textContent = "Buat akun baru dengan Registration Key";
    });

    document.getElementById("show-login").addEventListener("click", (e) => {
      e.preventDefault();
      registerForm.style.display = "none";
      loginForm.style.display = "block";
      formTitle.textContent = "Login";
      formSubtitle.textContent = "Masuk untuk mengelola data Import";
    });

    // Handle Login
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login");
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-password").value;

      btn.disabled = true;
      btn.textContent = "Memproses...";

      try {
        await sbLogin(email, pass);
        window.location.href = "../index.html";
      } catch (err) {
        // If login fails, probably invalid credentials or unverified email
        if (err.message && err.message.toLowerCase().includes("email not confirmed")) {
          showToast("Email belum dikonfirmasi. Silakan periksa inbox email Anda.", "error");
        } else {
          showToast("Gagal masuk. Periksa email dan password Anda.", "error");
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });

    // Handle Register
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-register");
      const email = document.getElementById("reg-email").value;
      const pass = document.getElementById("reg-password").value;
      const key = document.getElementById("reg-key").value;

      btn.disabled = true;
      btn.textContent = "Memproses...";

      try {
        await sbRegister(email, pass, key);
        // Supabase sends a confirmation email by default
        showToast("Berhasil mendaftar! Silakan periksa inbox/spam email Anda untuk konfirmasi sebelum login.", "success");
        document.getElementById("show-login").click();
      } catch (err) {
        // Here err.message will hold the string from our Postgres trigger exception
        showToast(err.message || "Gagal mendaftar. Key salah atau email sudah terpakai.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Daftar";
      }
    });
  </script>
</body>

</html>
