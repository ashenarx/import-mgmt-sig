<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master PO - Import Management SIG</title>
  <link rel="preload" href="../assets/images/app-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="app-page">
  <div class="page-container">
    <nav class="page-nav">
      <a href="../index.html">← Kembali ke Home</a>
    </nav>

    <h1>Master PO</h1>

    <div class="two-column">
      <div class="table-side">
        <div class="table-header">
          <div class="search-container">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="search-input" placeholder="Cari Nomor PO atau Vendor...">
          </div>
        </div>

        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th data-sort="nomor_po" onclick="sortTable('nomor_po')" style="cursor: pointer; user-select: none;">
                  Nomor PO<span class="sort-icon"></span></th>
                <th data-sort="shipment" onclick="sortTable('shipment')" style="cursor: pointer; user-select: none;">
                  Shipment<span class="sort-icon"></span></th>
                <th data-sort="plant" onclick="sortTable('plant')" style="cursor: pointer; user-select: none;">
                  Plant<span class="sort-icon"></span></th>
                <th data-sort="vendor" onclick="sortTable('vendor')" style="cursor: pointer; user-select: none;">
                  Vendor<span class="sort-icon"></span></th>
                <th style="text-align: right; width: 1%; white-space: nowrap;">Actions</th>
              </tr>
            </thead>
            <tbody id="po-table-body">
              <tr>
                <td colspan="5">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="form-side">
        <form id="add-po-form">
          <h3>Tambah PO Baru</h3>

          <label>
            Nomor PO
            <input type="text" id="nomor_po" required>
          </label>

          <label>
            Shipment
            <input type="number" id="shipment" min="0" step="1" required>
          </label>

          <label>
            Plant
            <input type="text" id="plant">
          </label>

          <label>
            Vendor
            <input type="text" id="vendor">
          </label>

      <label class="grid-span-full">
        Lampiran Dokumen
        <div style="display:flex; gap: 8px; align-items: center;">
          <input type="file" id="lampiran_file" style="flex: 1;">
          <div id="lampiran_link"></div>
        </div>
      </label>
          <button type="submit" class="grid-span-full btn-primary" style="margin-top: var(--space-lg);">Tambah &amp;
            Pilih PO Ini</button>
        </form>
      </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/page-utils.js"></script>
    <script>
      let allPOs = [];
      let renderedData = []; // tracks the currently-displayed slice (filtered/sorted)
      let isEditMode = false;
      let currentEditKeys = null;

      function selectPO(po) {
        sessionStorage.setItem("selectedPO", JSON.stringify({
          id: po.id,
          nomor_po: po.nomor_po,
          shipment: po.shipment,
          plant: po.plant,
          vendor: po.vendor,
          deskripsi_barang: po.deskripsi_barang
        }));
        window.location.href = "../index.html";
      }

      function renderTable(data) {
        renderedData = data;
        const tbody = document.getElementById("po-table-body");
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5">Belum ada data PO.</td></tr>`;
          return;
        }
        tbody.innerHTML = data.map((po, i) => `
        <tr>
          <td>${escapeHtml(po.nomor_po)}</td>
          <td>${po.shipment}</td>
          <td>${escapeHtml(po.plant ?? "")}</td>
          <td>${escapeHtml(po.vendor ?? "")}</td>
          <td style="text-align: right; white-space: nowrap;">
            <button class="btn-ghost btn-sm" data-action="select" data-idx="${i}">Pilih</button>
            <button class="btn-ghost btn-sm" data-action="edit"   data-idx="${i}">Edit</button>
            <button class="btn-error btn-sm" data-action="delete" data-idx="${i}">Hapus</button>
          </td>
        </tr>
      `).join("");
      }

      // Single delegated listener — no inline onclick needed
      document.getElementById("po-table-body").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const po = renderedData[parseInt(btn.dataset.idx)];
        if (!po) return;
        const action = btn.dataset.action;
        if (action === "select") selectPO(po);
        if (action === "edit") editPO(po);
        if (action === "delete") deletePO(po);
      });

      let sortCol = "";
      let sortAsc = true;

      function sortTable(column) {
        if (sortCol === column) {
          sortAsc = !sortAsc;
        } else {
          sortCol = column;
          sortAsc = true;
        }

        document.querySelectorAll("th[data-sort]").forEach(th => {
          const icon = th.querySelector(".sort-icon");
          icon.innerText = th.getAttribute("data-sort") === sortCol
            ? (sortAsc ? "\u00A0↑" : "\u00A0↓")
            : "";
        });

        allPOs.sort((a, b) => {
          let valA = a[column] === null ? "" : a[column];
          let valB = b[column] === null ? "" : b[column];
          if (typeof valA === "string") valA = valA.toLowerCase();
          if (typeof valB === "string") valB = valB.toLowerCase();
          if (valA < valB) return sortAsc ? -1 : 1;
          if (valA > valB) return sortAsc ? 1 : -1;
          return 0;
        });

        document.getElementById("search-input").dispatchEvent(new Event("input"));
      }

      async function loadPOs() {
        const tbody = document.getElementById("po-table-body");
        try {
          allPOs = await sbGet("master_po_data", "?select=*&order=nomor_po");
          renderTable(allPOs);
        } catch (err) {
          console.error(err);
          tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="table-error">
                <div class="table-error-header">
                  <svg class="table-error-icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </svg>
                  <span>Gagal memuat data PO</span>
                </div>
                <div class="table-error-message">
                  Data PO tidak dapat dimuat. Periksa koneksi Anda lalu coba lagi.
                </div>
                <button type="button" class="btn-ghost btn-sm" onclick="loadPOs()">
                  Coba Lagi
                </button>
              </div>
            </td>
          </tr>
        `;
        }
      }

      document.getElementById("search-input").addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allPOs.filter(po =>
          po.nomor_po.toLowerCase().includes(term) ||
          (po.vendor && po.vendor.toLowerCase().includes(term))
        );
        renderTable(filtered);
      });

      async function deletePO(po) {
        if (!confirm(`Yakin ingin menghapus PO ${po.nomor_po} (Shipment ${po.shipment})?`)) return;
        try {
          const filter = po.id ? `id=eq.${po.id}` : `nomor_po=eq.${encodeURIComponent(po.nomor_po)}&shipment=eq.${po.shipment}`;
          await sbDelete("master_po_data", filter);
          const currentSelected = JSON.parse(sessionStorage.getItem("selectedPO"));
          if (currentSelected && currentSelected.nomor_po === po.nomor_po && currentSelected.shipment === po.shipment) {
            sessionStorage.removeItem("selectedPO");
          }
          showToast("PO berhasil dihapus", "success");
          loadPOs();
        } catch (err) {
          showToast("Gagal menghapus PO: " + err.message, "error");
        }
      }

      function editPO(po) {
        isEditMode = true;
        currentEditKeys = po.id ? { id: po.id } : { nomor_po: po.nomor_po, shipment: po.shipment };
        document.getElementById("nomor_po").value = po.nomor_po;
        document.getElementById("shipment").value = po.shipment;
        document.getElementById("plant").value = po.plant || "";
        document.getElementById("vendor").value = po.vendor || "";
        if(po.lampiran_url) { document.getElementById("lampiran_link").innerHTML = `<a href="${escapeHtml(po.lampiran_url)}" target="_blank" style="color:var(--success); font-weight:500;">Lihat ${escapeHtml(po.nama_lampiran || 'Lampiran')}</a>`; } else { document.getElementById("lampiran_link").innerHTML = ""; }
        document.querySelector("#add-po-form h3").innerText = "Edit PO";
        document.querySelector("#add-po-form button[type='submit']").innerText = "Update Data PO";
      }

      document.getElementById("add-po-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = {
          nomor_po: document.getElementById("nomor_po").value,
          shipment: parseInt(document.getElementById("shipment").value),
          plant: document.getElementById("plant").value || null,
          vendor: document.getElementById("vendor").value || null,
        };
        setSubmitting(e.target, true);
        
      const fileInput = document.getElementById("lampiran_file");
      if (fileInput && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const ext = file.name.split('.').pop();
        const uniqueName = `${Date.now()}-${Math.random().toString(36).substring(2, 8)}.${ext}`;
        const filePath = `${masterId || nomorPO + '-' + shipment}/${uniqueName}`;
        try {
          await sbUploadFile("attachments", filePath, file);
          formData.lampiran_url = sbGetPublicUrl("attachments", filePath);
          formData.nama_lampiran = file.name;
        } catch(err) {
          showToast("Gagal upload lampiran: " + err.message, "error");
          return;
        }
      }

        try {
          if (isEditMode) {
            const filter = currentEditKeys.id
              ? `id=eq.${currentEditKeys.id}`
              : `nomor_po=eq.${encodeURIComponent(currentEditKeys.nomor_po)}&shipment=eq.${currentEditKeys.shipment}`;
            await sbUpdate("master_po_data", formData, filter);
            showToast("PO berhasil diupdate", "success");
            isEditMode = false;
            currentEditKeys = null;
            document.querySelector("#add-po-form h3").innerText = "Tambah PO Baru";
            document.querySelector("#add-po-form button[type='submit']").innerText = "Tambah & Pilih PO Ini";
          } else {
            const inserted = await sbInsert("master_po_data", formData);
            showToast("PO berhasil ditambahkan", "success");
            if (inserted && inserted.length > 0) {
              selectPO(inserted[0]);
            } else {
              selectPO(formData);
            }
          }
          document.getElementById("add-po-form").reset();
          loadPOs();
        } catch (err) {
          console.error(err);
          if (err.code === "23505") {
            showToast(
              `Gagal ${isEditMode ? "mengupdate" : "menambah"} PO: Nomor PO ${formData.nomor_po} (Shipment ${formData.shipment}) sudah terdaftar.`,
              "error"
            );
          } else {
            showToast(
              getSupabaseErrorMessage(err, `Gagal ${isEditMode ? "mengupdate" : "menambah"} PO. Silakan coba lagi.`),
              "error"
            );
          }
        } finally {
          setSubmitting(e.target, false);
        }
      });

      loadPOs();
    </script>
</body>

</html>
