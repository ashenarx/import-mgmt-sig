<html>
<head>
  <meta charset="UTF-8">
  <title>Master PO - Import Management SIG</title>
  <link rel="preload" href="../assets/images/app-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="app-page">
  <div class="page-container">
    <nav class="page-nav">
      <a href="../index.html">← Kembali ke Home</a>
    </nav>

    <h1>Master PO</h1>

    <div class="two-column">
      <div class="table-side">
        <div class="table-header">
          <div class="search-container">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="search-input" placeholder="Cari Nomor PO atau Vendor...">
          </div>
        </div>
        
        <div style="overflow-x: auto;">
            <table>
            <thead>
              <tr>
                <th data-sort="nomor_po" onclick="sortTable('nomor_po')" style="cursor: pointer; user-select: none;">Nomor PO<span class="sort-icon"></span></th>
                <th data-sort="shipment" onclick="sortTable('shipment')" style="cursor: pointer; user-select: none;">Shipment<span class="sort-icon"></span></th>
                <th data-sort="plant" onclick="sortTable('plant')" style="cursor: pointer; user-select: none;">Plant<span class="sort-icon"></span></th>
                <th data-sort="vendor" onclick="sortTable('vendor')" style="cursor: pointer; user-select: none;">Vendor<span class="sort-icon"></span></th>
                <th style="text-align: right; width: 1%; white-space: nowrap;">Actions</th>
              </tr>
            </thead>
            <tbody id="po-table-body">
              <tr><td colspan="5">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="form-side">
        <form id="add-po-form">
          <h3>Tambah PO Baru</h3>

          <label>
            Nomor PO
            <input type="text" id="nomor_po" required>
          </label>

          <label>
            Shipment
            <input type="number" id="shipment" min="0" step="1" required>
          </label>

          <label>
            Plant
            <input type="text" id="plant">
          </label>

          <label>
            Vendor
            <input type="text" id="vendor">
          </label>

          <button type="submit" class="grid-span-full btn-primary" style="margin-top: var(--space-lg);">Tambah & Pilih PO Ini</button>
        </form>
      </div>
    </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/page-utils.js"></script>
  <script>
        let allPOs = [];
    let isEditMode = false;
    let currentEditKeys = null; 

    function selectPO(nomor_po, shipment) {
      sessionStorage.setItem("selectedPO", JSON.stringify({ nomor_po, shipment }));
      window.location.href = "../index.html";
    }

    function renderTable(data) {
      const tbody = document.getElementById("po-table-body");
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5">Belum ada data PO.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(po => `
        <tr>
          <td>${po.nomor_po}</td>
          <td>${po.shipment}</td>
          <td>${po.plant ?? ""}</td>
          <td>${po.vendor ?? ""}</td>
          <td style="text-align: right; white-space: nowrap;">
            <button class="btn-ghost btn-sm" onclick='selectPO("${po.nomor_po}", ${po.shipment})'>Pilih</button>
            <button class="btn-ghost btn-sm" onclick='editPO(${JSON.stringify(po)})'>Edit</button>
            <button class="btn-error btn-sm" onclick='deletePO("${po.nomor_po}", ${po.shipment})'>Hapus</button>
          </td>
        </tr>
      `).join("");
    }

    let sortCol = '';
    let sortAsc = true;

    function sortTable(column) {
      if (sortCol === column) {
        sortAsc = !sortAsc;
      } else {
        sortCol = column;
        sortAsc = true;
      }

      document.querySelectorAll("th[data-sort]").forEach(th => {
        const icon = th.querySelector(".sort-icon");
        if (th.getAttribute("data-sort") === sortCol) {
          icon.innerText = sortAsc ? "\u00A0↑" : "\u00A0↓"; 
        } else {
          icon.innerText = ""; 
        }
      });

      allPOs.sort((a, b) => {
        let valA = a[column] === null ? "" : a[column];
        let valB = b[column] === null ? "" : b[column];

        if (typeof valA === "string") valA = valA.toLowerCase();
        if (typeof valB === "string") valB = valB.toLowerCase();

        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      document.getElementById("search-input").dispatchEvent(new Event("input"));
    }

    async function loadPOs() {
      const tbody = document.getElementById("po-table-body");

      try {
        allPOs = await sbGet("master_po_data", "?select=*&order=nomor_po");
        renderTable(allPOs);
      } catch (err) {
        console.error(err);

        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="table-error">
                <div class="table-error-header">
                  <svg class="table-error-icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </svg>
                  <span>Gagal memuat data PO</span>
                </div>

                <div class="table-error-message">
                  Data PO tidak dapat dimuat. Periksa koneksi Anda lalu coba lagi.
                </div>

                <button type="button" class="btn-ghost btn-sm" onclick="loadPOs()">
                  Coba Lagi
                </button>
              </div>
            </td>
          </tr>
        `;
      }
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allPOs.filter(po => 
        po.nomor_po.toLowerCase().includes(term) || 
        (po.vendor && po.vendor.toLowerCase().includes(term))
      );
      renderTable(filtered);
    });


    async function deletePO(nomor_po, shipment) {
      if (!confirm(`Yakin ingin menghapus PO ${nomor_po} (Shipment ${shipment})?`)) return;
      
      try {
        const filter = `nomor_po=eq.${encodeURIComponent(nomor_po)}&shipment=eq.${shipment}`;
        await sbDelete("master_po_data", filter);
        
        const currentSelected = JSON.parse(sessionStorage.getItem("selectedPO"));
        if (currentSelected && currentSelected.nomor_po === nomor_po && currentSelected.shipment === shipment) {
          sessionStorage.removeItem("selectedPO");
        }

        showToast("PO berhasil dihapus", "success");
        loadPOs();
      } catch (err) {
        showToast("Gagal menghapus PO: " + err.message, "error");
      }
    }

    function editPO(po) {
      isEditMode = true;
      currentEditKeys = { nomor_po: po.nomor_po, shipment: po.shipment };
      
      document.getElementById("nomor_po").value = po.nomor_po;
      document.getElementById("shipment").value = po.shipment;
      document.getElementById("plant").value = po.plant || "";
      document.getElementById("vendor").value = po.vendor || "";
      
      document.querySelector("#add-po-form h3").innerText = "Edit PO";
      document.querySelector("#add-po-form button[type='submit']").innerText = "Update Data PO";
    }

    document.getElementById("add-po-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const formData = {
        nomor_po: document.getElementById("nomor_po").value,
        shipment: parseInt(document.getElementById("shipment").value),
        plant: document.getElementById("plant").value || null,
        vendor: document.getElementById("vendor").value || null,
      };

      try {
        if (isEditMode) {
          const filter = `nomor_po=eq.${encodeURIComponent(currentEditKeys.nomor_po)}&shipment=eq.${currentEditKeys.shipment}`;
          await sbUpdate("master_po_data", formData, filter);
          showToast("PO berhasil diupdate", "success");
          
          isEditMode = false;
          currentEditKeys = null;
          document.querySelector("#add-po-form h3").innerText = "Tambah PO Baru";
          document.querySelector("#add-po-form button[type='submit']").innerText = "Tambah & Pilih PO Ini";
        } else {
          await sbInsert("master_po_data", formData);
          showToast("PO berhasil ditambahkan", "success");
          selectPO(formData.nomor_po, formData.shipment);
        }
        
        document.getElementById("add-po-form").reset();
        loadPOs();
      } catch (err) {
        console.error(err);

        if (err.code === "23505") {
          showToast(
            `Gagal ${isEditMode ? "mengupdate" : "menambah"} PO: Nomor PO ${formData.nomor_po} (Shipment ${formData.shipment}) sudah terdaftar.`,
            "error"
          );
        } else {
          showToast(
            getSupabaseErrorMessage(
              err,
              `Gagal ${isEditMode ? "mengupdate" : "menambah"} PO. Silakan coba lagi.`
            ),
            "error"
          );
        }
      }
    });

    loadPOs();
  </script>
</body>
</html>
