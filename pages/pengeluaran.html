<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengeluaran Barang - Import Management SIG</title>
  <link rel="preload" href="../assets/images/app-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="app-page">
  <div class="page-container">
    <nav class="page-nav">
      <a href="../index.html">← Kembali ke Home</a>
    </nav>
    <h1>Pengeluaran Barang</h1>
    <div id="po-context" class="po-banner"></div>

    <form id="pengeluaran-form" class="grid-form">
      <label>
        ATA (Actual Time Arrival)
        <input type="date" id="ata">
      </label>

      <label>
        SPPB Date
        <input type="date" id="sppb_date">
      </label>

      <label>
        Tanggal Cargo Tiba di Plant
        <input type="date" id="cargo_tiba_di_plant">
      </label>

      <label>
        Tanggal Cargo Kembali ke Depo
        <input type="date" id="cargo_kembali_ke_depo">
      </label>

      <label>
        DO Notify by Shipper
        <input type="date" id="do_notify_by_shipper">
      </label>

      <label>
        DO Release by Shipper
        <input type="date" id="do_release_by_shipper">
      </label>

      <label>
        Cargo Keluar dari Pelabuhan
        <input type="date" id="cargo_keluar_dari_pelabuhan">
      </label>

      <label>
        Masa Freetime D&D (hari)
        <input type="number" min="0" id="masa_freetime_dd">
      </label>

      <label>
        Masa II
        <input type="number" min="0" id="masa_ii">
      </label>

      <label>
        Masa 1.1
        <input type="number" min="0" id="masa_1_1">
      </label>

      <label>
        Masa 1.2
        <input type="number" min="0" id="masa_1_2">
      </label>

      <label>
        Masa 1.3
        <input type="number" min="0" id="masa_1_3">
      </label>

      <label>
        Masa III
        <input type="number" min="0" id="masa_iii">
      </label>

      <label>
        Durasi Penumpukan (hari)
        <input type="number" min="0" id="durasi_penumpukan">
      </label>

      <label>
        Nilai Penumpukan
        <input type="number" min="0" step="0.01" id="nilai_penumpukan">
      </label>

      <label>
        Status D&D
        <select id="status_dd">
          <option value="">-- Pilih --</option>
          <option value="NO PAY D&D">NO PAY D&D</option>
          <option value="PAY D&D">PAY D&D</option>
        </select>
      </label>

      <label>
        Nilai D&D
        <input type="number" min="0" step="0.01" id="nilai_dd">
      </label>

      <button type="submit" class="grid-span-full btn-primary">Simpan Pengeluaran Barang</button>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/page-utils.js"></script>
  <script>
    let recordId = null;

    const fields = [
      "ata", "sppb_date", "cargo_tiba_di_plant", "cargo_kembali_ke_depo",
      "do_notify_by_shipper", "do_release_by_shipper",
      "cargo_keluar_dari_pelabuhan", "masa_freetime_dd", "masa_ii",
      "masa_1_1", "masa_1_2", "masa_1_3", "masa_iii", "durasi_penumpukan",
      "nilai_penumpukan", "status_dd", "nilai_dd"
    ];

    async function loadPengeluaran() {
      try {
        const data = await sbGet("pengeluaran_barang", `?${poFilter()}&select=*&limit=1`);
        if (data.length > 0) {
          recordId = data[0].id;
          fields.forEach(f => {
            document.getElementById(f).value = data[0][f] ?? "";
          });
        }
      } catch (err) {
        showToast("Gagal memuat Pengeluaran Barang: " + err.message, "error");
      }
    }

    document.getElementById("pengeluaran-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      setSubmitting(e.target, true);
      const data = {
        master_id: masterId ? parseInt(masterId) : null,
        nomor_po: nomorPO,
        shipment: parseInt(shipment)
      };
      fields.forEach(f => {
        data[f] = document.getElementById(f).value || null;
      });
      try {
        if (recordId) {
          await sbUpdate("pengeluaran_barang", data, `id=eq.${recordId}`);
        } else {
          const inserted = await sbInsert("pengeluaran_barang", data);
          recordId = inserted[0].id;
        }
        showToast("Pengeluaran Barang berhasil disimpan", "success");
      } catch (err) {
        showToast(getSupabaseErrorMessage(err, "Gagal menyimpan: " + err.message), "error");
      } finally {
        setSubmitting(e.target, false);
      }
    });

    loadContext();
    loadPengeluaran();
  </script>
</body>

</html>
