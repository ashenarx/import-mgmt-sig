<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proses PIB - Import Management SIG</title>
  <link rel="preload" href="../assets/images/app-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="app-page">
  <div class="page-container">
    <nav class="page-nav">
      <a href="../index.html">← Kembali ke Home</a>
    </nav>
    <h1>Proses PIB</h1>
    <div id="po-context" class="po-banner"></div>

    <form id="pib-form" class="grid-form">
      <label>
        Tanggal Permintaan Draft PIB
        <input type="date" id="permintaan_draft_pib">
      </label>

      <label>
        Tanggal Terima Draft PIB
        <input type="date" id="terima_draft_pib">
      </label>

      <label>
        Actual Time Arrived (ATA)
        <input type="date" id="ata">
      </label>

      <label>
        Tanggal Confirm Draft PIB
        <input type="date" id="confirm_draft_pib">
      </label>

      <label>
        Tanggal PPJK Create Billing PIB
        <input type="date" id="ppjk_create_billing_pib">
      </label>

      <label>
        Tanggal BC 1.1 Release
        <input type="date" id="bc_11_release">
      </label>

      <label>
        No. AJU PIB
        <input type="text" id="no_aju_pib">
      </label>

      <label>
        No. Pendaftaran (NOPEN)
        <input type="text" id="nopen">
      </label>

      <label>
        HS Code
        <input type="text" id="hs_code">
      </label>

      <label>
        No. SPPB
        <input type="text" id="no_sppb">
      </label>

      <label>
        SPPB Date
        <input type="date" id="sppb_date">
      </label>

      <label>
        Tanggal Create PP PIB
        <input type="date" id="create_pp_pib">
      </label>

      <label>
        Tanggal Approval PP PIB
        <input type="date" id="approval_pp_pib">
      </label>

      <label>
        Tanggal Kirim PP PIB
        <input type="date" id="kirim_pp_pib">
      </label>

      <label>
        MIR7 PP PIB
        <input type="text" id="mir7_pp_pib">
      </label>

      <label>
        No. PP PIB
        <input type="text" id="no_pp_pib">
      </label>

      <label>
        Nilai PP PIB
        <input type="number" step="0.01" min="0" id="nilai_pp_pib">
      </label>

      <label>
        Nilai Pabean
        <input type="number" step="0.01" min="0" id="nilai_pabean">
      </label>

      <label>
        Nilai Bea Masuk
        <input type="number" step="0.01" min="0" id="nilai_bea_masuk">
      </label>

      <label>
        Tarif BM (%)
        <input type="number" step="0.01" min="0" id="tarif_bm">
      </label>

      <label>
        Nilai PPN
        <input type="number" step="0.01" min="0" id="nilai_ppn">
      </label>

      <label>
        Nilai PPH
        <input type="number" step="0.01" min="0" id="nilai_pph">
      </label>

      <label>
        No. PJK PP PIB
        <input type="text" id="no_pjk_pp_pib">
      </label>

      <label>
        Tanggal Create PJK PIB
        <input type="date" id="create_pjk_pib">
      </label>

      <label>
        Tanggal Approval PJK PIB
        <input type="date" id="approval_pjk_pib">
      </label>

      <label>
        Tanggal Kirim PJK PIB
        <input type="date" id="kirim_pjk_pib">
      </label>

      <label>
        MIR7 PJK PIB
        <input type="text" id="mir7_pjk_pib">
      </label>

      <label>
        Status PIB
        <select id="status_pib">
          <option value="">-- Pilih --</option>
          <option value="PROSES">PROSES</option>
          <option value="DONE">DONE</option>
        </select>
      </label>

      <label class="grid-span-full">
        Keterangan Tambahan
        <textarea id="keterangan_tambahan" rows="1"></textarea>
      </label>

      <button type="submit" class="grid-span-full btn-primary">Simpan Proses PIB</button>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/page-utils.js"></script>
  <script>
    let recordId = null;

    const fields = [
      "permintaan_draft_pib", "terima_draft_pib", "ata", "confirm_draft_pib",
      "ppjk_create_billing_pib", "bc_11_release", "no_aju_pib", "nopen", "hs_code",
      "no_sppb", "sppb_date", "create_pp_pib", "approval_pp_pib", "kirim_pp_pib",
      "mir7_pp_pib", "no_pp_pib", "nilai_pp_pib", "nilai_pabean", "nilai_bea_masuk",
      "tarif_bm", "nilai_ppn", "nilai_pph", "no_pjk_pp_pib", "create_pjk_pib",
      "approval_pjk_pib", "kirim_pjk_pib", "mir7_pjk_pib", "status_pib",
      "keterangan_tambahan"
    ];

    async function loadPIB() {
      try {
        const data = await sbGet("proses_pib", `?${poFilter()}&select=*&limit=1`);
        if (data.length > 0) {
          recordId = data[0].id;
          const p = data[0];
          fields.forEach(f => {
            document.getElementById(f).value = p[f] ?? "";
          });
        }
      } catch (err) {
        showToast("Gagal memuat Proses PIB: " + err.message, "error");
      }
    }

    document.getElementById("pib-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      setSubmitting(e.target, true);
      const data = {
        master_id: masterId ? parseInt(masterId) : null,
        nomor_po: nomorPO,
        shipment: parseInt(shipment)
      };
      fields.forEach(f => {
        data[f] = document.getElementById(f).value || null;
      });
      try {
        if (recordId) {
          await sbUpdate("proses_pib", data, `id=eq.${recordId}`);
        } else {
          const inserted = await sbInsert("proses_pib", data);
          if (inserted && inserted.length > 0) {
            recordId = inserted[0].id;
          }
        }
        showToast("Proses PIB berhasil disimpan", "success");
      } catch (err) {
        showToast(getSupabaseErrorMessage(err, "Gagal menyimpan: " + err.message), "error");
      } finally {
        setSubmitting(e.target, false);
      }
    });

    loadContext();
    loadPIB();
  </script>
</body>
</html>
