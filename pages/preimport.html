<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pre-Import Review - Import Management SIG</title>
  <link rel="preload" href="../assets/images/app-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="app-page">
  <div class="page-container">
    <nav class="page-nav">
      <a href="../index.html">← Kembali ke Home</a>
    </nav>
    <h1>Pre-Import Review</h1>
    <div id="po-context" class="po-banner"></div>

    <form id="preimport-form" class="grid-form">
      <label>
        Tanggal Review Draft OP
        <input type="date" id="review_draft_op">
      </label>

      <label>
        Keterangan Review Draft OP
        <textarea id="review_draft_op_keterangan" placeholder="mis. OK" rows="1"></textarea>
      </label>

      <label>
        Tanggal Cek Lartas
        <input type="date" id="cek_lartas">
      </label>

      <label>
        Keterangan Lartas
        <textarea id="cek_lartas_keterangan" placeholder="mis. OK" rows="1"></textarea>
      </label>

      <label>
        Tanggal Cek Perijinan Impor
        <input type="date" id="cek_perijinan_impor">
      </label>

      <label>
        Keterangan Perijinan Impor
        <textarea id="cek_perijinan_impor_keterangan" placeholder="mis. OK" rows="1"></textarea>
      </label>

      <label>
        Tanggal Kirim L/C Guidance
        <input type="date" id="kirim_lc_guidance">
      </label>

      <label>
        Keterangan Kirim L/C Guidance
        <textarea id="kirim_lc_guidance_keterangan" placeholder="mis. TT (jika non-L/C)" rows="1"></textarea>
      </label>

      <label>
        Status
        <select id="status">
          <option value="">-- Pilih --</option>
          <option value="PROSES">PROSES</option>
          <option value="DONE">DONE</option>
        </select>
      </label>

      <label>
        Lartas?
        <select id="lartas">
          <option value="">-- Pilih --</option>
          <option value="YA">YA</option>
          <option value="TIDAK">TIDAK</option>
        </select>
      </label>

      <label>
        Kuota PI?
        <select id="kuota_pi">
          <option value="">-- Pilih --</option>
          <option value="YA">YA</option>
          <option value="TIDAK">TIDAK</option>
        </select>
      </label>

      <label>
        Nama Lampiran
        <input type="text" id="nama_lampiran">
      </label>

      <button type="submit" class="grid-span-full btn-primary">Simpan PreImport Review</button>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/page-utils.js"></script>
  <script>
    let recordId = null;

    const fields = [
      "review_draft_op", "review_draft_op_keterangan",
      "cek_lartas", "cek_lartas_keterangan",
      "cek_perijinan_impor", "cek_perijinan_impor_keterangan",
      "kirim_lc_guidance", "kirim_lc_guidance_keterangan",
      "status", "lartas", "kuota_pi", "nama_lampiran"
    ];

    async function loadPreImport() {
      try {
        const data = await sbGet("pre_po_impor", `?${poFilter()}&select=*&limit=1`);
        if (data.length > 0) {
          recordId = data[0].id;
          const p = data[0];
          fields.forEach(f => {
            document.getElementById(f).value = p[f] ?? "";
          });
        }
      } catch (err) {
        showToast("Gagal memuat PreImport review: " + err.message, "error");
      }
    }

    document.getElementById("preimport-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        master_id: masterId ? parseInt(masterId) : null,
        nomor_po: nomorPO,
        shipment: parseInt(shipment)
      };
      fields.forEach(f => {
        data[f] = document.getElementById(f).value || null;
      });
      setSubmitting(e.target, true);
      try {
        if (recordId) {
          await sbUpdate("pre_po_impor", data, `id=eq.${recordId}`);
        } else {
          const inserted = await sbInsert("pre_po_impor", data);
          if (inserted && inserted.length > 0) {
            recordId = inserted[0].id;
          }
        }
        showToast("PreImport review berhasil disimpan", "success");
      } catch (err) {
        showToast("Gagal menyimpan: " + err.message, "error");
      } finally {
        setSubmitting(e.target, false);
      }
    });

    loadContext();
    loadPreImport();
  </script>
</body>
</html>
