<html>
<head>
  <meta charset="UTF-8">
  <title>Pre-Import Review - Import Management SIG</title>
  <link rel="preload" href="../assets/images/app-page.avif" as="image">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="app-page">
  <div class="page-container">
    <nav class="page-nav">
      <a href="../index.html">← Kembali ke Home</a>
    </nav>
    <h1>Pre-Import Review</h1>
    <div id="po-context" class="po-banner"></div>

    <form id="preimport-form" class="grid-form">
      <label>
        Tanggal Review Draft OP
        <input type="date" id="review_draft_op">
      </label>
      <label>
        Keterangan Review Draft OP
        <input type="text" id="review_draft_op_keterangan" placeholder="mis. OK">
      </label>

      <label>
        Tanggal Cek Lartas
        <input type="date" id="cek_lartas">
      </label>
      <label>
        Keterangan Lartas
        <input type="text" id="cek_lartas_keterangan" placeholder="mis. OK">
      </label>

      <label>
        Tanggal Cek Perijinan Impor
        <input type="date" id="cek_perijinan_impor">
      </label>
      <label>
        Keterangan Perijinan Impor
        <input type="text" id="cek_perijinan_impor_keterangan" placeholder="mis. OK">
      </label>

      <label>
        Tanggal Kirim L/C Guidance
        <input type="date" id="kirim_lc_guidance">
      </label>
      <label>
        Keterangan Kirim L/C Guidance
        <input type="text" id="kirim_lc_guidance_keterangan" placeholder="mis. TT (jika non-L/C)">
      </label>

      <label>
        Status
        <select id="status">
          <option value="">-- Pilih --</option>
          <option value="PROSES">PROSES</option>
          <option value="DONE">DONE</option>
        </select>
      </label>
      <label>
        Lartas?
        <select id="lartas">
          <option value="">-- Pilih --</option>
          <option value="YA">YA</option>
          <option value="TIDAK">TIDAK</option>
        </select>
      </label>

      <label>
        Kuota PI?
        <select id="kuota_pi">
          <option value="">-- Pilih --</option>
          <option value="YA">YA</option>
          <option value="TIDAK">TIDAK</option>
        </select>
      </label>
      <label>
        Nama Lampiran
        <input type="text" id="nama_lampiran">
      </label>

      <button type="submit" class="grid-span-full">Simpan PreImport Review</button>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nomorPO = params.get("po");
    const shipment = params.get("shipment");
    let preimportExists = false;

    function poFilter() {
      return `nomor_po=eq.${encodeURIComponent(nomorPO)}&shipment=eq.${shipment}`;
    }

    async function loadContext() {
      const ctx = document.getElementById("po-context");
      if (!nomorPO || !shipment) {
        ctx.innerHTML = `<em>PO tidak ditemukan di URL. Kembali ke Home dan pilih PO terlebih dahulu.</em>`;
        return;
      }
      try {
        const master = await sbGet("master_po_data", `?${poFilter()}&select=*`);
        if (master.length === 0) {
          ctx.innerHTML = `<em>Data master PO tidak ditemukan.</em>`;
          return;
        }
        const po = master[0];
        ctx.innerHTML = `
          <div>
            <span style="color: var(--text-secondary);">PO:</span> <strong>${po.nomor_po}</strong>
            <span style="color: var(--text-muted);"> | Shipment:</span> <strong>${po.shipment}</strong>
            <span style="color: var(--text-muted);"> | Plant:</span> ${po.plant ?? "-"}
            <span style="color: var(--text-muted);"> | Vendor:</span> ${po.vendor ?? "-"}
          </div>`;
      } catch (err) {
        ctx.innerHTML = `<em>Gagal memuat data: ${err.message}</em>`;
      }
    }

    async function loadPreImport() {
      try {
        const data = await sbGet("pre_po_impor", `?${poFilter()}&select=*`);
        if (data.length > 0) {
          preimportExists = true;
          const p = data[0];
          document.getElementById("review_draft_op").value = p.review_draft_op || "";
          document.getElementById("review_draft_op_keterangan").value = p.review_draft_op_keterangan || "";
          document.getElementById("cek_lartas").value = p.cek_lartas || "";
          document.getElementById("cek_lartas_keterangan").value = p.cek_lartas_keterangan || "";
          document.getElementById("cek_perijinan_impor").value = p.cek_perijinan_impor || "";
          document.getElementById("cek_perijinan_impor_keterangan").value = p.cek_perijinan_impor_keterangan || "";
          document.getElementById("kirim_lc_guidance").value = p.kirim_lc_guidance || "";
          document.getElementById("kirim_lc_guidance_keterangan").value = p.kirim_lc_guidance_keterangan || "";
          document.getElementById("status").value = p.status || "";
          document.getElementById("lartas").value = p.lartas || "";
          document.getElementById("kuota_pi").value = p.kuota_pi || "";
          document.getElementById("nama_lampiran").value = p.nama_lampiran || "";
        }
      } catch (err) {
        showToast("Gagal memuat PreImport review: " + err.message, "error");
      }
    }

    document.getElementById("preimport-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        nomor_po: nomorPO,
        shipment: parseInt(shipment),
        review_draft_op: document.getElementById("review_draft_op").value || null,
        review_draft_op_keterangan: document.getElementById("review_draft_op_keterangan").value || null,
        cek_lartas: document.getElementById("cek_lartas").value || null,
        cek_lartas_keterangan: document.getElementById("cek_lartas_keterangan").value || null,
        cek_perijinan_impor: document.getElementById("cek_perijinan_impor").value || null,
        cek_perijinan_impor_keterangan: document.getElementById("cek_perijinan_impor_keterangan").value || null,
        kirim_lc_guidance: document.getElementById("kirim_lc_guidance").value || null,
        kirim_lc_guidance_keterangan: document.getElementById("kirim_lc_guidance_keterangan").value || null,
        status: document.getElementById("status").value || null,
        lartas: document.getElementById("lartas").value || null,
        kuota_pi: document.getElementById("kuota_pi").value || null,
        nama_lampiran: document.getElementById("nama_lampiran").value || null,
      };
      try {
        if (preimportExists) {
          await sbUpdate("pre_po_impor", data, poFilter());
        } else {
          await sbInsert("pre_po_impor", data);
          preimportExists = true;
        }
        showToast("PreImport review berhasil disimpan", "success");
      } catch (err) {
        showToast("Gagal menyimpan: " + err.message, "error");
      }
    });

    loadContext();
    loadPreImport();
  </script>
</body>
</html>
